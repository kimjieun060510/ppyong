<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#6bb34d" />
    <title>공원 두더지 팡!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="chip coin">
          <span class="icon">●</span>
          <span id="coin-count">0</span>
        </div>
        <div class="chip">
          콤보 <span id="combo-count">0</span>
        </div>
      </div>
      <div class="hud-right">
        <div class="chip">라운드 <span id="round-count">1</span></div>
        <div class="chip time"><span id="time-left">40</span>초</div>
        <button id="btn-shop" type="button">상점</button>
      </div>
    </div>

    <div id="title" class="overlay">
      <div class="panel title-panel">
        <p class="eyebrow">PARK MOLE CATCHER</p>
        <h1>공원 두더지 팡!</h1>
        <p class="lead">
          공원 곳곳에 구멍이 열려요. 뛰어다니며 두더지를 잡고,
          모은 코인으로 뿅망치를 업그레이드하세요.
        </p>
        <ul class="howto">
          <li>이동: 키보드 WASD / 왼쪽 동그라미를 끌어서</li>
          <li>공격: 스페이스 · 근처로 달려가기 · 오른쪽 뿅망치</li>
          <li>갈색·황금 두더지만 잡으세요. 다른 동물은 피하세요</li>
          <li>연못에 빠지면 5초 동안 허우적거려요</li>
        </ul>
        <button id="btn-start" type="button" class="primary">게임 시작</button>
      </div>
    </div>

    <div id="shop" class="overlay hidden">
      <div class="panel shop-panel">
        <div class="shop-head">
          <h2>뿅망치 상점</h2>
          <p>코인 <strong id="shop-coins">0</strong></p>
        </div>
        <div id="shop-list" class="shop-list"></div>
        <div class="shop-actions">
          <button id="btn-close-shop" type="button" class="primary">
            다시 잡으러 가기
          </button>
        </div>
      </div>
    </div>

    <div id="round-over" class="overlay hidden">
      <div class="panel">
        <h2>라운드 끝!</h2>
        <p id="round-summary" class="lead"></p>
        <button id="btn-to-shop" type="button" class="primary">
          상점에서 업그레이드
        </button>
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <div class="panel">
        <h2 id="result-title">오늘 공원은 여기까지!</h2>
        <p id="result-summary" class="lead"></p>
        <button id="btn-retry" type="button" class="primary">한 판 더</button>
      </div>
    </div>

    <div id="soaked" class="overlay hidden">
      <div class="panel soak-panel">
        <h2 id="stun-title">풍덩!</h2>
        <p id="stun-lead" class="lead">물에 빠졌어요. 잠시 허우적거리는 중...</p>
        <p id="soak-count" class="countdown">5</p>
      </div>
    </div>

    <div id="controls" class="hidden">
      <div id="stick" aria-label="이동">
        <div id="stick-base">
          <span class="stick-dir north" aria-hidden="true"></span>
          <span class="stick-dir east" aria-hidden="true"></span>
          <span class="stick-dir south" aria-hidden="true"></span>
          <span class="stick-dir west" aria-hidden="true"></span>
          <div id="stick-knob"></div>
        </div>
      </div>
      <button id="btn-hammer" type="button" aria-label="뿅망치">
        <svg class="mallet-icon" viewBox="0 0 72 72" aria-hidden="true">
          <rect x="32" y="26" width="9" height="38" rx="4" fill="#c47a3a" stroke="#5a3518" stroke-width="2.5"/>
          <rect x="13" y="8" width="46" height="24" rx="7" fill="#ff6b4a" stroke="#2b3a24" stroke-width="3"/>
          <rect x="18" y="13" width="18" height="7" rx="3.5" fill="rgba(255,255,255,0.38)"/>
          <rect x="48" y="14" width="6" height="12" rx="2" fill="#d4552e"/>
        </svg>
      </button>
    </div>

    <script src="game.js"></script>
  </body>
</html>
